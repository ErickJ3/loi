# git-cliff config. Generates CHANGELOG.md in Keep a Changelog format.
# Run via `cargo xtask changelog` or `cargo xtask changelog-unreleased`.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% if commit.breaking %} (**breaking**){% endif %}\
{% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}](https://github.com/ErickJ3/loi/pull/{{ commit.remote.pr_number }})){% endif %}\
{% if commit.remote.username %} by @{{ commit.remote.username }}{% elif commit.author.name %} by {{ commit.author.name }}{% endif %}
{%- endfor %}
{% endfor %}
"""
trim = true
footer = ""

[remote.github]
owner = "ErickJ3"
repo = "loi"

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "newest"
topo_order = false

commit_preprocessors = [
  { pattern = '(?s)^Merge pull request #\d+ from [^\n]+\n+(.+)', replace = '${1}' },
]

commit_parsers = [
  { sha = "ad8aef74b287f67099f627431dac40de23ed8f52", group = "Added" },
  { field = "merge_commit", pattern = "^false$", skip = true },
  { message = "^feat",      group = "Added" },
  { message = "^add",       group = "Added" },
  { message = "^change",    group = "Changed" },
  { message = "^refactor",  group = "Changed" },
  { message = "^perf",      group = "Changed" },
  { message = "^deprecate", group = "Deprecated" },
  { message = "^remove",    group = "Removed" },
  { message = "^revert",    group = "Removed" },
  { message = "^fix",       group = "Fixed" },
  { message = "^security",  group = "Security" },
  { message = "^chore",     skip = true },
  { message = "^docs",      skip = true },
  { message = "^test",      skip = true },
  { message = "^ci",        skip = true },
  { message = "^style",     skip = true },
  { message = "^build",     skip = true },
  { body = ".*",            group = "Changed" },
]
